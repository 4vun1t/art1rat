[package]
name = "artirat-server"
version = "0.1.0"
edition = "2024"

[dependencies]
arti-client = "0.41"
tor-hsservice = "0.41"      # onion service support
tor-rtcompat = "0.41"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
debug = 0
lto = true
codegen-units = 1
strip = true
panic = "abort"
